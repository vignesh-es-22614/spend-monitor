name: Daily spend refresh

# 03:30 UTC = 09:00 IST. BigQuery runs 2-4 days behind, so an early run still
# picks up everything that has landed.
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Send the digest regardless of schedule'
        type: boolean
        default: false

# Needed to commit the rebuilt dashboard back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Only the cron function's deps are needed — BigQuery + nodemailer.
      - name: Install dependencies
        run: npm install --omit=dev --prefix functions/spend_pacing_cron

      - name: Sanity checks
        run: |
          node scripts/sync-lib.js --check
          node scripts/selftest.js

      - name: Build dashboard and send digest
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
        run: |
          if [ "${{ inputs.send_email }}" = "true" ]; then
            node scripts/build-site.js --force-email
          else
            node scripts/build-site.js --email
          fi

      - name: Commit the refreshed dashboard
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/
          if git diff --cached --quiet; then
            echo "No change in the data — nothing to commit."
          else
            git commit -m "Refresh dashboard — data through $(date -u +%Y-%m-%d)"
            git push
          fi
